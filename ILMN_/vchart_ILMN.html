for (const c of D.charts) {
  if (m && m !== c.key) continue;
  const s = document.createElement("section");
  s.id = c.key;

  const up = c.rows.map(r => r[2] >= r[1]);

              return q.slice(4) === D.tick && (this.chart.width >= 560 || c.rows.length < 16 || q.slice(0, 4) % 2 === 0)
                ? D.prefix + q.slice(0, 4) + " " + q.slice(-1) + q[4] : ""; }}},
        y: {position: "right", beginAtZero: true, grid: {color: grid},  // 0·최솟값 포함, 눈금은 Chart.js가 반올림

function arcResize() {
  if (parent === window) return;
  const h = Math.ceil(document.body.getBoundingClientRect().height);
  parent.postMessage({action: {action: "@webframe.resize", size: {aspectRatio: innerWidth / h, height: h}}}, "*");
}
addEventListener("load", arcResize);
new ResizeObserver(arcResize).observe(document.body);
