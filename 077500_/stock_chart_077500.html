const pf = {type: "price", precision: prec, minMove: prec ? 0.01 : 1};
const fmt = x => x == null ? "-" : x.toLocaleString("ko-KR", {maximumFractionDigits: 2});
const opts = axis => ({autoSize: true, layout: {background: {color: css("--bg")}, textColor: css("--mute"), fontSize: 10},
  grid: {vertLines: {visible: false}, horzLines: {color: css("--grid")}}, crosshair: {mode: 0},
  rightPriceScale: {borderVisible: false, minimumWidth: 64}, timeScale: {borderVisible: false, visible: axis},
  handleScroll: {vertTouchDrag: false}});  // 세로 스와이프는 페이지 스크롤
const mk = (id, axis) => LightweightCharts.createChart(document.getElementById(id), opts(axis));
const main = mk("main", false), rsi = mk("rsi", false), macd = mk("macd", true);
const line = (c, data, color, w = 1, f = pf) => c.addLineSeries({color, lineWidth: w, priceFormat: f, priceLineVisible: false,
  lastValueVisible: false, crosshairMarkerVisible: false}).setData(data);

main.addCandlestickSeries({upColor: "#EF5350", downColor: "#26A69A", borderVisible: false, priceFormat: pf,
  wickUpColor: "#EF5350", wickDownColor: "#26A69A"}).setData(D.c);
main.addHistogramSeries({priceFormat: {type: "volume"}, priceScaleId: "v", lastValueVisible: false, priceLineVisible: false})
  .setData(D.v);
main.priceScale("v").applyOptions({scaleMargins: {top: 0.8, bottom: 0}});
line(main, D.ma5, "#FF6D00"); line(main, D.ma20, "#2962FF"); line(main, D.ma60, "#E91E63");
line(main, D.bb_upper, "rgba(149,117,205,.5)"); line(main, D.bb_mid, "rgba(149,117,205,.3)"); line(main, D.bb_lower, "rgba(149,117,205,.5)");

const p0 = {type: "price", precision: 0, minMove: 1};
line(rsi, D.rsi, "#FF9800", 1.5, p0);
line(rsi, D.rsi.map(d => ({time: d.time, value: 70})), "rgba(239,83,80,.5)", 1, p0);
line(rsi, D.rsi.map(d => ({time: d.time, value: 30})), "rgba(38,166,154,.5)", 1, p0);
macd.addHistogramSeries({priceLineVisible: false, lastValueVisible: false})
  .setData(D.macd_hist.map(d => d.value == null ? d : {...d, color: d.value >= 0 ? "rgba(38,166,154,.6)" : "rgba(239,83,80,.6)"}));
line(macd, D.macd, "#2196F3", 1.5); line(macd, D.macd_signal, "#E91E63");

// 모든 시리즈가 같은 날짜 축(빈 값은 whitespace)이라 logical index로 맞춘다
const charts = [main, rsi, macd];
charts.forEach(c => c.timeScale().subscribeVisibleLogicalRangeChange(r => {
  if (r) charts.forEach(o => o !== c && o.timeScale().setVisibleLogicalRange(r)); }));
main.timeScale().setVisibleLogicalRange({from: Math.max(0, N - D.visible), to: N + 1});

function show(i) {
  if (i == null || i < 0 || i >= N) i = N - 1;
  const c = D.c[i], p = D.c[i - 1], chg = p ? (c.close / p.close - 1) * 100 : 0;
  const col = chg >= 0 ? "#EF5350" : "#26A69A";
  tip.innerHTML = `<b>유니퀘스트(077500)</b> ${c.time} 종가 <b style="color:${col}">${fmt(c.close)} (${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%)</b><br>` +
    `시 ${fmt(c.open)} · 고 ${fmt(c.high)} · 저 ${fmt(c.low)} · 거래량 ${fmt(D.v[i].value)}`;
  rsiL.textContent = `RSI(14) ${fmt(D.rsi[i].value)}`;
  macdL.textContent = `MACD(12,26,9) ${fmt(D.macd[i].value)} · Signal ${fmt(D.macd_signal[i].value)}`;
}
charts.forEach(c => c.subscribeCrosshairMove(p => show(p.logical)));
show();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => location.reload());
function arcResize() {
  if (parent === window) return;
  const h = Math.ceil(document.body.getBoundingClientRect().height);
  parent.postMessage({action: {action: "@webframe.resize", size: {aspectRatio: innerWidth / h, height: h}}}, "*");
}
addEventListener("load", arcResize);
new ResizeObserver(arcResize).observe(document.body);
</script></body></html>
