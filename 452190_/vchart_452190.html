<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>한빛레이저 V차트</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>body{margin:0;padding:8px;font:13px -apple-system,sans-serif;color:#333;background:transparent}
section{margin-bottom:16px}h3{margin:0 0 4px;font-size:13px;font-weight:600}.box{position:relative;height:260px}
:root{color-scheme:light dark}
@media (prefers-color-scheme:dark){body{color:#ddd;background:#1e1e1e}}</style></head><body>
<script>
const D = {"charts": [{"key": "revenue", "title": "매출액", "rows": [["2025Q1", 185.4, 161.5], ["2025Q2", 161.5, 210.3], ["2025Q3", 210.3, 216.8], ["2025Q4", 216.8, 242.5], ["2026Q1", 242.5, 297.7], ["2026Q2", 297.7, 261.6]]}, {"key": "op", "title": "영업이익", "rows": [["2025Q1", -25.6, -34.3], ["2025Q2", -34.3, -19.2], ["2025Q3", -19.2, -16.4], ["2025Q4", -16.4, 19.6], ["2026Q1", 19.6, 33.6], ["2026Q2", 33.6, 29.4]]}, {"key": "ni_parent", "title": "지배주주순이익", "rows": [["2025Q1", -21.1, -34.3], ["2025Q2", -34.3, -21.2], ["2025Q3", -21.2, -18.3], ["2025Q4", -18.3, 24.4], ["2026Q1", 24.4, 39.9], ["2026Q2", 39.9, 35.2]]}], "unit": "억원", "tick": "Q2", "prefix": ""};
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
Chart.defaults.color = dark ? "#bbb" : "#555";
const grid = dark ? "rgba(255,255,255,.12)" : "rgba(0,0,0,.08)";
const m = new URLSearchParams(location.search).get("m") || location.hash.slice(1);
const f1 = x => x.toLocaleString("ko-KR", {minimumFractionDigits: 1, maximumFractionDigits: 1});
for (const c of D.charts) {
  if (m && m !== c.key) continue;
  const s = document.createElement("section");
  s.id = c.key;
  s.innerHTML = (m ? "" : `<h3>${c.title} (V차트) · 단위 ${D.unit}</h3>`) + '<div class="box"><canvas></canvas></div>';
  document.body.append(s);
  const up = c.rows.map(r => r[2] >= r[1]);
  new Chart(s.querySelector("canvas"), {
    data: {labels: c.rows.map(r => D.prefix + r[0].slice(0, 4) + " " + r[0].slice(-1) + r[0][4]), datasets: [
      {type: "bar", data: c.rows.map(r => r[1] === null ? null : [r[1], r[2]]), backgroundColor: up.map(u => u ? "#e5484d" : "#3e63dd"),
       barPercentage: 0.7, categoryPercentage: 0.9, minBarLength: 2, order: 2},
      {type: "line", data: c.rows.map(r => r[2]), borderColor: "rgba(245,197,66,.85)", borderWidth: 2,
       pointRadius: 0, pointHoverRadius: 0, order: 1}]},
    options: {maintainAspectRatio: false, animation: false, interaction: {mode: "index", intersect: false},
      events: ["mousemove", "mouseout", "click", "touchstart", "touchmove"],
      plugins: {legend: {display: false}, tooltip: {filter: i => i.datasetIndex === 0 && c.rows[i.dataIndex][2] !== null, displayColors: true,
        callbacks: {
          label: i => { const [, p, t] = c.rows[i.dataIndex]; return f1(t) + " " + D.unit; },
          afterLabel: i => { const [, p, t] = c.rows[i.dataIndex], d = t - p;
            return `변동: ${d >= 0 ? "+" : ""}${f1(d)} ${D.unit} (${d >= 0 ? "+" : ""}${p ? (d / Math.abs(p) * 100).toFixed(1) : "-"}%)`; },
          labelColor: i => ({borderColor: "transparent", backgroundColor: up[i.dataIndex] ? "#e5484d" : "#3e63dd"})}}},
      scales: {
        x: {grid: {display: false}, ticks: {autoSkip: false, maxRotation: 0, font: {size: 10},
            callback: function (v, i) { const q = c.rows[i][0];  // 좁은 화면 + 막대 16개 이상이면 격년만
              return q.slice(4) === D.tick && (this.chart.width >= 560 || c.rows.length < 16 || q.slice(0, 4) % 2 === 0)
                ? D.prefix + q.slice(0, 4) + " " + q.slice(-1) + q[4] : ""; }}},
        y: {position: "right", beginAtZero: true, grid: {color: grid},  // 0·최솟값 포함, 눈금은 Chart.js가 반올림
            ticks: {font: {size: 10}, callback: v => v.toLocaleString("ko-KR")}}}}});
}
function arcResize() {
  if (parent === window) return;
  const h = Math.ceil(document.body.getBoundingClientRect().height);
  parent.postMessage({action: {action: "@webframe.resize", size: {aspectRatio: innerWidth / h, height: h}}}, "*");
}
addEventListener("load", arcResize);
new ResizeObserver(arcResize).observe(document.body);
</script></body></html>
